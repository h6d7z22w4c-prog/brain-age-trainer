function updateStreak(){if(state.lastDay===today())return;if(state.lastDay===yesterday())state.streak++;else state.streak=1;state.lastDay=today()}
function finishTraining(){clearInterval(timer);clearTimeout(transition);const r=training.results,correct=r.filter(x=>x.correct).length,accuracy=Math.round(correct/r.length*100),avgTime=r.reduce((a,x)=>a+x.time,0)/r.length,speed=clamp(Math.round(100-avgTime*6.5),20,99),score=Math.round(accuracy*.65+speed*.35),counts={math:0,memory:0,attention:0,logic:0,speed:0},typesUsed=[];r.forEach(x=>{counts[x.task.cat]=(counts[x.task.cat]||0)+1;typesUsed.push(x.task.type)});const previousBest=state.sessions.reduce((m,x)=>Math.max(m,x.score),0),skillScores={accuracy,speed};['math','memory','attention','logic'].forEach(k=>{const c=counts[k];skillScores[k]=c?Math.round(r.filter(x=>x.task.cat===k&&x.correct).length/c*100):null});const taskStats={};r.forEach(x=>{const id=x.task.type;if(!taskStats[id])taskStats[id]={answered:0,errors:0,time:0};taskStats[id].answered++;if(!x.correct)taskStats[id].errors++;taskStats[id].time+=x.time});Object.values(taskStats).forEach(x=>x.time=+x.time.toFixed(1));const session={date:today(),score,accuracy,speed,avgTime:+avgTime.toFixed(1),correct,answered:r.length,types:[...new Set(typesUsed)],categories:counts,skillScores,taskStats,best:score>previousBest,ageChange:0};updateStreak();state.totalAnswered+=r.length;state.totalCorrect+=correct;state.stats.accuracy=Math.round(state.stats.accuracy*.65+accuracy*.35);state.stats.speed=Math.round(state.stats.speed*.65+speed*.35);['math','memory','attention','logic'].forEach(k=>{const c=counts[k];if(c){const val=r.filter(x=>x.task.cat===k&&x.correct).length/c*100;state.stats[k]=Math.round(state.stats[k]*.72+val*.28)}});state.xp+=Math.round(score*.6)+correct*2;while(state.xp>=levelNeed(state.level)&&state.level<levels.length){state.xp-=levelNeed(state.level);state.level++}const oldAge=state.brainAge;if(state.sessions.length>=2){const s=state.stats,idx=s.accuracy*.28+s.speed*.22+s.memory*.17+s.attention*.17+s.logic*.16,raw=Math.round(clamp(68-idx*.42,20,65));state.brainAge=oldAge===null?raw:Math.round(oldAge+(raw-oldAge)*.3);state.ageDelta=oldAge===null?0:state.brainAge-oldAge;session.ageChange=state.ageDelta}state.sessions.push(session);state.sessions=state.sessions.slice(-60);state.completedTrainings=(state.completedTrainings||0)+1;refreshAbilityStats();state.lastResult=session;updateChallengeCompletion();checkBadges();training=null;state.screen='result';save();render()}
function checkBadges(){badges.forEach(b=>{if(!state.achievements.includes(b.id)&&typeof b.test==='function'&&b.test(state)){state.achievements.push(b.id);setTimeout(()=>showToast('Новое достижение: '+b.name),300)}})}
function showToast(text){const e=document.getElementById('toast');e.textContent=text;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function levelName(){return levels[clamp(state.level-1,0,levels.length-1)]}
function levelNeed(level){return 100*Math.pow(2,Math.max(0,Number(level)-1))}
function yearWord(n){n=Math.abs(Number(n))%100;const x=n%10;return n>10&&n<20?'лет':x===1?'год':x>=2&&x<=4?'года':'лет'}
function nav(){const items=[['home','Главная'],['progress','Прогресс'],['abilities','Карта способностей'],['achievements','Достижения'],['challenge','Челлендж']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="navbtn ${state.screen===x[0]?'active':''}" data-nav="${x[0]}">${x[1]}</button>`).join('')}
function bars(){const s=state.stats;return `<div class="bars">${[['Память','memory'],['Внимание','attention'],['Устный счёт','math'],['Логика','logic']].map(x=>`<div class="barline"><span>${x[0]}</span><div class="bar"><i style="width:${s[x[1]]}%"></i></div><b>${s[x[1]]}</b></div>`).join('')}</div>`}
function difficultTasks(){const recent=state.sessions.slice(-5);if(recent.length<5||recent.some(x=>!x.taskStats))return[];const all={};recent.forEach(s=>Object.entries(s.taskStats).forEach(([id,v])=>{if(!all[id])all[id]={answered:0,errors:0,time:0};all[id].answered+=v.answered||0;all[id].errors+=v.errors||0;all[id].time+=v.time||0}));return Object.entries(all).map(([id,v])=>({id:+id,name:types[+id-1]?.[0]||'Задание',icon:typeIcon(+id),rate:v.answered?Math.round(v.errors/v.answered*100):0,answered:v.answered,avg:v.answered?v.time/v.answered:0})).sort((a,b)=>b.rate-a.rate||b.avg-a.avg).slice(0,3)}
function renderHome(){const s=state.stats,age=state.brainAge===null?'—':state.brainAge,c=currentChallenge(),cv=challengeValue(c),done=state.challengeWins.includes(c.key);return `<div class="hero"><section class="card agecard"><div class="eyebrow">ТВОЙ МОЗГОВОЙ ВОЗРАСТ</div><div class="age">${age}</div><div class="muted">${state.brainAge===null?'Нужно 3 тренировки для расчёта':yearWord(state.brainAge)+' · игровой показатель'}</div><div class="delta">${state.ageDelta<0?'↓ '+Math.abs(state.ageDelta)+' '+yearWord(state.ageDelta)+' к прошлому результату':state.ageDelta>0?'↑ '+state.ageDelta+' '+yearWord(state.ageDelta)+' к прошлому результату':'Стабильный результат'}</div><div class="pills"><span class="pill">Точность ${s.accuracy}%</span><span class="pill">Скорость ${s.speed}</span><span class="pill">Серия ${state.streak} дн.</span></div></section><section class="card traincard"><div><div class="eyebrow">ТРЕНИРОВКА ДНЯ</div><h1>6 минут.<br>Мозг в форме.</h1><div class="muted">10 разных заданий · новый набор каждый раз</div></div><button class="bigbtn" data-action="start">НАЧАТЬ ТРЕНИРОВКУ</button></section></div><div class="statsrow"><div class="stat"><strong>${state.streak} 🔥</strong><small>серия дней</small></div><div class="stat"><strong>${state.level}</strong><small>${levelName()}</small></div><div class="stat"><strong>${state.totalAnswered}</strong><small>решено заданий</small></div><div class="stat"><strong>${state.sessions.length?Math.max(...state.sessions.map(x=>x.score)):0}</strong><small>личный рекорд</small></div></div><div class="below"><section class="card"><div class="sectiontitle"><h2>Текущая форма</h2><button class="ghostbtn" data-nav="abilities">Карта способностей</button></div>${bars()}<div class="progress" style="margin-top:18px"><i style="width:${state.level<levels.length?Math.min(100,state.xp/levelNeed(state.level)*100):100}%"></i></div><div class="levelmeta"><span>Уровень: ${levelName()}</span><span>${state.level<levels.length?'До следующего: '+Math.max(0,levelNeed(state.level)-state.xp)+' XP':'Максимальный уровень'}</span></div></section><section class="card challenge"><div class="eyebrow">ЧЕЛЛЕНДЖ НЕДЕЛИ · УРОВЕНЬ ${c.tier+1}</div><h2>${c.title}</h2><div class="muted">${c.description.replace('{n}',c.goal)}</div><div class="progress" style="margin-top:22px"><i style="width:${challengePercent(cv,c.goal)}%"></i></div><div class="levelmeta"><span>${Math.min(cv,c.goal)}/${c.goal} ${c.unit}</span><span>${done?'Достижение получено':'В процессе'}</span></div></section></div><p class="footer">«Мозговой возраст» — игровая метрика, а не медицинская оценка или диагностика.</p>`}
function renderProgress(){const ss=state.sessions.slice(-10),max=Math.max(100,...ss.map(x=>x.score)),hard=difficultTasks(),need=Math.max(0,5-state.sessions.filter(x=>x.taskStats).slice(-5).length);return `<div class="pagehead"><div><div class="eyebrow">ЛИЧНАЯ ДИНАМИКА</div><h1>Прогресс</h1></div><span class="pill">${state.sessions.length} тренировок</span></div><div class="split"><section class="card"><div class="sectiontitle"><h2>Общий результат</h2><span class="muted">из 100</span></div><p class="muted" style="margin:-4px 0 18px;line-height:1.55">Оценка каждой тренировки от 0 до 100 баллов: 65% результата зависит от точности ответов, 35% — от скорости выполнения.</p>${ss.length?`<div class="chart">${ss.map((x,i)=>`<div class="chartcol"><span>${x.score}</span><i style="height:${x.score/max*100}%"></i><span>№${i+1}</span></div>`).join('')}</div>`:'<div class="empty">Здесь появится история тренировок.</div>'}</section><section class="card"><div class="sectiontitle"><h2>Сложные задания</h2><span class="muted">за 5 тренировок</span></div>${hard.length?`<div class="hard-list">${hard.map(x=>`<div class="hard-task"><span class="hard-icon" aria-hidden="true">${x.icon}</span><div><b>${esc(x.name)}</b><small>${x.answered} ${x.answered===1?'ответ':x.answered<5?'ответа':'ответов'}</small></div><div class="hard-rate">${x.rate}%<small>ошибок</small></div></div>`).join('')}</div>`:`<div class="empty">Рейтинг появится через ${need||5} ${need===1?'тренировку':need>1&&need<5?'тренировки':'тренировок'}.</div>`}</section></div>`}
function radarPoints(values,cx,cy,r){return values.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length,rr=r*v/100;return `${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)}`}).join(' ')}
function renderAbilities(){const completed=Math.max(Number(state.completedTrainings)||0,state.sessions.length);if(!state.abilityStats&&completed>=5&&refreshAbilityStats(true))save();const entries=[['Точность','accuracy'],['Скорость','speed'],['Память','memory'],['Внимание','attention'],['Счёт','math'],['Логика','logic']],hasCalculation=!!state.abilityStats,snapshot=state.abilityStats,vals=hasCalculation?entries.map(x=>snapshot[x[1]]):[],rings=[25,50,75,100],cx=160,cy=160,r=112,axes=entries.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/entries.length;return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}"/>`}).join(''),grid=rings.map(v=>`<polygon class="radar-grid" points="${radarPoints(entries.map(()=>v),cx,cy,r)}"/>`).join(''),dots=hasCalculation?vals.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/vals.length,rr=r*v/100;return `<circle class="radar-dot" cx="${cx+Math.cos(a)*rr}" cy="${cy+Math.sin(a)*rr}" r="4"/>`}).join(''):'',labels=entries.map((x,i)=>{const a=-Math.PI/2+i*Math.PI*2/entries.length,lr=r+29;return `<text class="radar-label" x="${cx+Math.cos(a)*lr}" y="${cy+Math.sin(a)*lr-3}">${x[0]}</text>${hasCalculation?`<text class="radar-value" x="${cx+Math.cos(a)*lr}" y="${cy+Math.sin(a)*lr+10}">${vals[i]}%</text>`:''}`}).join(''),remaining=5-completed%5,status=hasCalculation?`по последним 5 · следующее обновление через ${remaining}`:`до первого расчёта: ${Math.max(0,5-completed)}`;if(!hasCalculation)return `<div class="pagehead"><div><div class="eyebrow">ТВОЙ ПРОФИЛЬ</div><h1>Карта способностей</h1></div><span class="pill">${status}</span></div><section class="card"><div class="radar"><svg viewBox="0 0 320 320" role="img" aria-label="Карта способностей до первого расчёта">${grid}${axes}${labels}</svg></div></section>`;const minValue=Math.min(...vals),weakIndex=vals.indexOf(minValue),weakEntry=entries[weakIndex],weak=weakEntry[0].toLowerCase();return `<div class="pagehead"><div><div class="eyebrow">ТВОЙ ПРОФИЛЬ</div><h1>Карта способностей</h1></div><span class="pill">${status}</span></div><section class="card ability-wrap"><div class="radar"><svg viewBox="0 0 320 320" role="img" aria-label="Карта способностей. Значения указаны в процентах.">${grid}${axes}<polygon class="radar-area" points="${radarPoints(vals,cx,cy,r)}"/>${dots}${labels}</svg></div><div><div class="sectiontitle"><h2>Что улучшить первым</h2><span class="muted">один простой шаг</span></div><div class="ability-note">Сейчас внимания требует <b style="color:var(--text)">${weak}: ${minValue}%</b>.</div><div class="daily-tip"><b style="display:block;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem">${abilityAdvice[weakEntry[1]].startsWith('Микротренировка:')?'Микротренировка дня':'Совет дня'}</b>${esc(abilityAdvice[weakEntry[1]].replace(/^Микротренировка:\s*/,''))}</div></div></section>`}
function renderAchievements(){const unlocked=badges.filter(b=>state.achievements.includes(b.id)).length,seenTypes=new Set(state.sessions.flatMap(x=>x.types||[]));return `<div class="pagehead"><div><div class="eyebrow">ЛИЧНЫЕ ПОБЕДЫ</div><h1>Достижения</h1></div><span class="pill">${unlocked}/${badges.length}</span></div><section class="card"><div class="achievementgrid">${badges.map(b=>state.achievements.includes(b.id)?`<div class="achievement on"><span style="font-size:26px">${b.icon}</span><b>${b.name}</b><p>${b.desc}</p><span class="lock">✓</span></div>`:`<div class="achievement locked" title="Неоткрытое достижение" aria-label="Неоткрытое достижение"><span class="badge-silhouette">🏆</span></div>`).join('')}</div></section><section class="card" style="margin-top:16px"><div class="sectiontitle"><div><h2>Типы заданий</h2><div class="muted" style="margin-top:5px">Узнайте все 30 типов — у каждого свой знак</div></div><span class="pill">${seenTypes.size}/${types.length}</span></div><div class="achievementgrid">${types.map((x,i)=>{const id=i+1,seen=seenTypes.has(id);return seen?`<div class="achievement on"><span style="font-size:30px;color:var(--accentInk)">${typeIcon(id)}</span><b>${esc(x[0])}</b><p>Тип задания встречен</p><span class="lock">✓</span></div>`:`<div class="achievement locked" title="Неоткрытый тип задания" aria-label="Неоткрытый тип задания"><span class="badge-silhouette">${typeIcon(id)}</span></div>`}).join('')}</div></section>`}
function renderChallenge(){const c=currentChallenge(),value=challengeValue(c),done=state.challengeWins.includes(c.key),left=Math.max(0,c.goal-value);return `<div class="pagehead"><div><div class="eyebrow">ИСПЫТАНИЕ НЕДЕЛИ</div><h1>Челлендж</h1></div><span class="pill">Обновляется по понедельникам</span></div><section class="card challenge"><div class="eyebrow">ТЕКУЩАЯ ЦЕЛЬ · СЛОЖНОСТЬ ${c.tier+1}/3</div><h2>${c.title}</h2><p class="muted">${c.description.replace('{n}',c.goal)}</p><div class="progress" style="margin-top:24px"><i style="width:${challengePercent(value,c.goal)}%"></i></div><div class="levelmeta"><b>${Math.min(value,c.goal)}/${c.goal} ${c.unit}</b><span>${done?'Достижение получено':'Осталось '+left}</span></div><p class="muted" style="margin:18px 0 0">Награда: уникальное достижение «${c.title}». Всего завершено недельных челленджей: ${state.challengeWins.length}.</p><button class="bigbtn" style="margin-top:24px" data-action="start">${done?'ТРЕНИРОВАТЬСЯ ЕЩЁ':'ПРОДОЛЖИТЬ ЧЕЛЛЕНДЖ'}</button></section>`}
function renderExercise(){const t=training.tasks[training.index],recall=t.meta.memory&&training.recall,pct=training.index/training.tasks.length*100;let prompt='',body='',helper='';if(t.meta.memory&&!recall){prompt=`<div class="taskprompt ${t.meta.compact?'compact':''}">${t.prompt}</div>`;helper='<div class="helper">Запомни: содержимое скоро исчезнет.</div>'}else if(t.meta.memory&&recall&&t.meta.symbol){prompt=`<div class="taskprompt compact">${t.meta.recall}</div>`;body=`<div class="answers">${t.options.map(o=>`<button class="answerbtn" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}else if(t.meta.memory&&recall){const typed=training.input||'',digits=Array.from({length:10},(_,i)=>`<button class="digitbtn" data-digit="${i}">${i}</button>`).join('');prompt=`<div class="taskprompt compact">${t.meta.recall}</div>`;body=`<div class="memory-entry">${typed?esc(typed.split('').join(' · ')):'—'}</div><div class="digitpad">${digits}</div><div class="memory-actions"><button class="ghostbtn" data-action="back">⌫ Стереть</button><button class="bigbtn" data-action="memory-submit">Готово</button></div>`}else{prompt=`<div class="taskprompt ${t.meta.compact?'compact':''}">${t.prompt}</div>`;body=t.options?`<div class="answers">${t.options.map(o=>`<button class="answerbtn" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:'<input id="answer" class="answerinput" inputmode="numeric" autocomplete="off" placeholder="Твой ответ">'}return `<div class="exercise-shell"><div class="exercise-top"><span class="eyebrow">${String(training.index+1).padStart(2,'0')} / ${training.tasks.length}</span><span class="timer" id="timer">—</span></div><div class="progressline"><i style="width:${pct}%"></i></div><section class="card taskcard"><div class="tasktype">${types[t.type-1][0]}</div>${prompt}${body}<div class="feedback" id="feedback"></div>${helper}</section></div>`}
function renderResult(){const r=state.lastResult||{},age=state.brainAge===null?'—':state.brainAge,phrase=r.score>=90?'Калькулятор пишет заявление.':r.score>=75?'Синапсы в отличной форме.':r.score>=55?'Мозг вышел на рабочую температуру.':'Разминка завершена. Продолжаем.';return `<div class="resultwrap"><section class="card resultmain"><div class="eyebrow">ТРЕНИРОВКА ЗАКОНЧЕНА</div><h1>${phrase}</h1><div class="scorebig">${r.score}<small style="font-size:.25em;color:var(--muted)">/ 100</small></div><div class="resultgrid"><div class="stat"><strong>${r.correct}/${r.answered||10}</strong><small>правильно</small></div><div class="stat"><strong>${r.accuracy}%</strong><small>точность</small></div><div class="stat"><strong>${r.avgTime}с</strong><small>средний ответ</small></div><div class="stat"><strong>${state.streak} 🔥</strong><small>серия</small></div></div><div class="stat" style="text-align:left"><strong>${age}${state.brainAge===null?'':' '+yearWord(age)}</strong><small>мозговой возраст · ${r.ageChange<0?'−'+Math.abs(r.ageChange)+' '+yearWord(r.ageChange):r.ageChange>0?'+'+r.ageChange+' '+yearWord(r.ageChange):'без изменений'}</small></div>${r.best?'<p style="color:var(--accent);font-weight:900">Новый личный рекорд!</p>':''}<div class="cta"><button class="bigbtn" data-action="repeat">ПОВТОРИТЬ ТРЕНИРОВКУ</button><button class="ghostbtn" data-nav="home">ЗАКОНЧИТЬ</button></div></section></div>`}
function render(){const root=document.getElementById('app');document.documentElement.dataset.theme=state.theme;document.body.classList.toggle('exercise-mode',state.screen==='exercise');document.querySelectorAll('[data-theme-value]').forEach(x=>{const active=x.dataset.themeValue===state.theme;x.classList.toggle('active',active);x.setAttribute('aria-current',active?'true':'false')});nav();if(state.screen==='home')root.innerHTML=renderHome();else if(state.screen==='progress')root.innerHTML=renderProgress();else if(state.screen==='abilities')root.innerHTML=renderAbilities();else if(state.screen==='achievements')root.innerHTML=renderAchievements();else if(state.screen==='challenge')root.innerHTML=renderChallenge();else if(state.screen==='exercise'&&training)root.innerHTML=renderExercise();else if(state.screen==='result'&&state.lastResult)root.innerHTML=renderResult();else{state.screen='home';root.innerHTML=renderHome()}}
document.addEventListener('click',e=>{const themeBtn=e.target.closest('#themeBtn'),themePopover=document.getElementById('themePopover'),themeChoice=e.target.closest('[data-theme-value]');if(themeBtn){const open=themePopover.hasAttribute('hidden');themePopover.toggleAttribute('hidden',!open);themeBtn.setAttribute('aria-expanded',String(open));return}if(themeChoice){state.theme=themeChoice.dataset.themeValue;save();themePopover.hidden=true;const btn=document.getElementById('themeBtn');if(btn)btn.setAttribute('aria-expanded','false');render();return}if(themePopover&&!e.target.closest('.theme-picker')){themePopover.hidden=true;const btn=document.getElementById('themeBtn');if(btn)btn.setAttribute('aria-expanded','false')}const navEl=e.target.closest('[data-nav]');if(navEl){state.screen=navEl.dataset.nav;save();render();return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='start'||a==='repeat'){startTraining();return}if(a==='back'&&training){training.input=training.input.slice(0,-1);render();return}if(a==='memory-submit'&&training){submitAnswer(training.input||'',false);return}}const digit=e.target.closest('[data-digit]');if(digit&&training&&!training.locked){const max=training.tasks[training.index].meta.length||6;if(training.input.length<max){training.input+=digit.dataset.digit;render()}return}const ans=e.target.closest('[data-answer]');if(ans){submitAnswer(ans.dataset.answer,false);return}if(e.target.id==='resetBtn'&&confirm('Сбросить весь прогресс?')){state=defaults();save();render();showToast('Прогресс сброшен')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.screen==='exercise'){const input=document.getElementById('answer');if(input)submitAnswer(input.value,false)}});
render();
